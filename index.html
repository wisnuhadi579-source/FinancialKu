    <script>
      (function() {
        // Fix for browser extensions attempting to reassign window.fetch when it only has a getter
        try {
          var rawFetch = window.fetch;
          if (rawFetch) {
            var activeFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;
            var descriptor = {
              configurable: true,
              enumerable: true,
              get: function() {
                return activeFetch;
              },
              set: function(val) {
                activeFetch = val;
              }
            };
            try { Object.defineProperty(window, 'fetch', descriptor); } catch (_) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch (_) {}
            }
          }
        } catch (_) {}

        // Suppress unhandled errors originating from external browser extensions
        window.addEventListener('error', function(event) {
          var filename = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            filename.indexOf('chrome-extension://') !== -1 ||
            filename.indexOf('moz-extension://') !== -1 ||
            filename.indexOf('safari-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1 ||
            stack.indexOf('safari-extension://') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
